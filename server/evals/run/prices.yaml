# Pinned price table for the evaluation's cost accounting.
#
# A generate or judge run refuses to start until every rate for the models it will call is a
# number and `verified` is true. Bump `version` and `as_of` whenever a rate changes; the version
# is written to every run manifest.
#
# Sources, read on 2026-11-21:
#   - deepseek-flash: DeepSeek's API pricing page (api-docs.deepseek.com/quick_start/pricing).
#     `deepseek-flash` is the model name to call; it is served by DeepSeek-V4.1-Flash-1017.
#   - anthropic/claude-haiku-5.5: OpenRouter's model page. Cache writes are not priced
#     separately here.
#   - anthropic/claude-haiku-5.5:batch: OpenRouter's model listing, read on 2026-11-26. The same
#     model through OpenRouter's batch API, at half the input and output rates. OpenRouter does
#     not list a batch cache-hit rate, so the hit rate is the full one, which can only overstate.
#   - text-embedding-3-small: OpenAI's model page.
#
# Rates are US dollars per 1M tokens: input cache miss, input cache hit and output. DeepSeek is
# priced separately for peak and off-peak hours. Its peak hours are 01:00-04:00 and
# 06:00-10:00 UTC, Monday to Friday; every other hour, weekends included, is off-peak. Chinese
# public holidays are also off-peak on DeepSeek's side but are not modelled, so a call on one is
# priced at the peak rate, which can only overstate the cost.
#
# Cohere and Jev report their own cost on every call, so they need no rate here.
version: "3"
as_of: 2026-11-26
verified: true

peak_hours:
  days: [1, 2, 3, 4, 5]
  windows_utc:
    - ["01:00", "04:00"]
    - ["06:00", "10:00"]

models:
  deepseek-flash:
    peak:
      input_cache_miss: 0.30
      input_cache_hit: 0.006
      output: 1.20
    off_peak:
      input_cache_miss: 0.15
      input_cache_hit: 0.003
      output: 0.60
  anthropic/claude-haiku-5.5:
    rates:
      input_cache_miss: 0.10
      input_cache_hit: 0.01
      output: 0.50
  anthropic/claude-haiku-5.5:batch:
    rates:
      input_cache_miss: 0.05
      input_cache_hit: 0.01
      output: 0.25

embeddings:
  text-embedding-3-small: 0.02
