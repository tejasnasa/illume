# Format example for a hand-written set. Not loaded for any real repository: a real set
# lives in hand/<corpus entry name>.yaml.
#
# An explain item needs a reference_answer (a few sentences) and required_files. The older
# architecture and flow kinds load too, with or without a reference_answer.
items:
  - kind: explain
    question: How does a login request end up with a session the browser keeps?
    reference_answer: >-
      The login route checks the submitted password against the stored hash, then signs a token
      for the user and sets it as an httponly cookie on the response. Later requests are
      identified by a middleware that decodes that cookie before any route runs.
    required_files:
      - app/api/auth.py
      - app/middleware/auth.py
    acceptable_files:
      - app/core/security.py
  - kind: architecture
    question: Where does the application decide which user a request belongs to?
    required_files:
      - app/middleware/auth.py
    acceptable_files:
      - app/api/deps.py
    notes: Authentication happens in a middleware before any route runs.
  - kind: flow
    question: What happens between a user submitting a login form and the session cookie being set?
    required_files:
      - app/api/auth.py
      - app/core/security.py
    acceptable_files:
      - app/models/user.py
    tags: [multi-file]
  - kind: unanswerable
    question: Which payment provider does the project use for subscriptions?
    notes: The repository has no payment code; a good answer says so.
