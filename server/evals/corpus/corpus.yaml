# The pinned evaluation corpus. Each entry is one repository frozen at a base commit B.
#
# Fields per entry under `repos`:
#   name              Short identifier used on the command line (`--repo NAME`). Unique.
#   url               Clone URL, e.g. https://github.com/owner/repo. The owner/repo pair
#                     also keys the GitHub cache directory.
#   language          Main language: Python, TypeScript, Go, or another that the tree-sitter
#                     parser handles well.
#   licence           One of MIT, Apache-2.0, BSD-2-Clause, BSD-3-Clause. Anything else is
#                     rejected.
#   base_commit       Full 40-character hex SHA of B, in quotes. Ingestion checks this commit out and
#                     nothing newer is ever visible to retrieval.
#   base_date         Commit date of B. Informational only.
#   era               Optional label for the period the repository belongs to, for example
#                     "before AI", "early AI" or "latest AI". The report prints it beside
#                     the repository's name.
#   generator_cutoff  Training cutoff of the question generator (default 2026-10-17). Pull
#                     requests merged after it are tagged post-cutoff and analysed apart.
#   drift_window      Commits after B inspected by the drift check (default 100).
#   history_prs       Merged pull requests before B ingested as history (default 200).
#   questions         The question mix, `{change: N, explain: M}` (default 35 and 25, 60 in
#                     all). A repository with fewer good pull requests takes more explain
#                     questions, so keep the two summing to 60.
#
# Selection rules:
#   - Permissive licence (MIT, Apache-2.0 or BSD).
#   - 200 to 3,000 source files at B.
#   - At least 300 merged pull requests with real descriptions.
#   - At least 150 pull requests merged after B, so questions have somewhere to come from.
#   - Not Illume itself.
#
# Example entry (kept commented out so the shipped file lists no repositories):
#   - name: example
#     url: https://github.com/owner/example
#     language: Python
#     licence: MIT
#     base_commit: "0123456789abcdef0123456789abcdef01234567"
#     base_date: 2026-06-01
#     era: before AI
#     questions: {change: 35, explain: 25}
repos:
  - name: pvlib
    url: https://github.com/pvlib/pvlib-python
    language: Python
    licence: BSD-3-Clause
    base_commit: "2cf4ee00a4e5ebe1ad2307c3d15ac48045c11406"
    base_date: 2026-04-29
    era: before AI
    questions: {change: 35, explain: 25}
  - name: langroid
    url: https://github.com/langroid/langroid
    language: Python
    licence: MIT
    base_commit: "a9186b51d8540bc0beec6612be9a7737c4b4ad24"
    base_date: 2026-05-28
    era: early AI
    questions: {change: 35, explain: 25}
  - name: rakazo
    url: https://github.com/elie222/rakazo
    language: TypeScript
    licence: Apache-2.0
    base_commit: "8986956f40950ee30f75355e9ec96f007774bc53"
    base_date: 2026-09-30
    era: latest AI
    questions: {change: 35, explain: 25}
