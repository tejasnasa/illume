name: Deploy Backend

# Runs **after CI succeeds on main**, not in parallel with it.
#
# The previous trigger was `push` on `server/**`, which meant a red main deployed: tests,
# lint, and types could all be failing and the image still went to the droplet. Gating on
# the CI run is what makes the checks load-bearing rather than advisory.
#
# The `paths: server/**` filter is gone with the push trigger, deliberately.
#
# `workflow_run` carries no push payload, so the range a push introduced is not
# recoverable from it -- `head_sha~1` would diff only the tip commit and miss a server
# change made in an earlier commit of the same push, which is exactly the silent skip the
# filter existed to avoid being wrong about. The trade-off taken here is the other way:
# a documentation-only commit now rebuilds and restarts the backend for nothing, which
# costs a few seconds of API downtime. A missed backend deploy costs more than that.
on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]

env:
  IMAGE_NAME: ${{ github.repository_owner }}/illume-server

jobs:
  build-and-deploy:
    # A failed or cancelled CI run, or one from another branch, must not reach the droplet.
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # The commit CI validated, not the branch tip -- those differ whenever a newer
          # push landed while CI was running, and deploying the tip would ship something
          # no check has seen.
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Log in to GHCR

        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image

        uses: docker/build-push-action@v5
        with:
          context: ./server
          push: true
          tags: ghcr.io/${{ env.IMAGE_NAME }}:latest

      - name: Deploy to Droplet

        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DO_HOST }}
          username: tejas
          key: ${{ secrets.DO_SSH_KEY }}
          script: |
            echo ${{ secrets.GITHUB_TOKEN }} | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            docker pull ghcr.io/${{ env.IMAGE_NAME }}:latest

            # The persistent state lives on the host so neither the clone cache nor the
            # beat schedule is destroyed by the ``docker stop && docker rm && docker run``
            # cycle that every deploy performs. ``/home/tejas/illume_data/clone_cache``
            # maps to the path ``repo_cache._cache_root`` resolves inside the Linux
            # container (``/tmp/illume/clone_cache``); ``/home/tejas/illume_data/state``
            # holds the beat schedule file at the explicit ``-s`` path the beat
            # invocation below points at. A new container's empty ``/tmp`` and
            # ``/var/illume`` are overlaid by these mounts; existing data is preserved.
            mkdir -p /home/tejas/illume_data/clone_cache
            mkdir -p /home/tejas/illume_data/state

            docker stop illume-server || true
            docker rm illume-server || true
            docker run -d \
              --name illume-server \
              --network illume-net \
              --restart unless-stopped \
              -p 8000:8000 \
              --env-file /home/tejas/illume.env \
              ghcr.io/${{ env.IMAGE_NAME }}:latest

            docker stop illume-worker || true
            docker rm illume-worker || true
            docker run -d \
              --name illume-worker \
              --network illume-net \
              --restart unless-stopped \
              --env-file /home/tejas/illume.env \
              -v /home/tejas/illume_data/clone_cache:/tmp/illume/clone_cache \
              ghcr.io/${{ env.IMAGE_NAME }}:latest \
              celery -A app.core.celery worker \
                --loglevel=info \
                --pool=prefork \
                --concurrency=1 \
                -Q celery,sync \
                --max-memory-per-child=614400

            # The beat process is a separate container so a worker restart (including the
            # ``--max-memory-per-child`` recycle) cannot interrupt the sweep cadence.
            # ``-s`` points at a bind-mounted file so the next beat process picks up the
            # last-run timestamp instead of re-firing every queued entry on restart.
            docker stop illume-beat || true
            docker rm illume-beat || true
            docker run -d \
              --name illume-beat \
              --network illume-net \
              --restart unless-stopped \
              --env-file /home/tejas/illume.env \
              -v /home/tejas/illume_data/state:/var/illume \
              ghcr.io/${{ env.IMAGE_NAME }}:latest \
              celery -A app.core.celery beat \
                --loglevel=info \
                -s /var/illume/celerybeat-schedule
