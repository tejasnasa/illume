# Drives the deployed site as a real signed-in account and checks the critical path.
#
# Deliberately separate from `ci.yml`, and not a name that workflow or `deploy.yml` watches.
# Everything in `ci.yml` runs against a stack the job boots itself; this one talks to
# production, writes to it (one chat turn, cleaned up), and must never be triggerable from a
# pull request.
name: Production Smoke

on:
  schedule:
    # Nightly, off the hour and clear of the local E2E job's 03:17 so the two do not queue
    # for the same runner minute.
    - cron: "43 4 * * *"
  # Manual runs only, for a re-check after a deploy or while debugging. No `pull_request`
  # trigger, now or later.
  workflow_dispatch:

# A manual run and the nightly must not overlap, and cancelling one mid-flight can leave the
# account in a half-asserted state, so in-progress runs are never cancelled.
concurrency:
  group: prod-smoke
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  prod-smoke:
    name: Production smoke (Playwright)
    runs-on: ubuntu-latest
    # Without this a hung run holds a non-cancelling concurrency group for up to the 6h
    # default, blocking the next night's run too.
    timeout-minutes: 20

    env:
      # Origins and the target repository name are not secret, so they live as repository
      # variables and stay readable in the log.
      SMOKE_BASE_URL: ${{ vars.SMOKE_BASE_URL }}
      SMOKE_API_URL: ${{ vars.SMOKE_API_URL }}
      SMOKE_REPO_NAME: ${{ vars.SMOKE_REPO_NAME }}
      SMOKE_EMAIL: ${{ secrets.SMOKE_EMAIL }}
      SMOKE_PASSWORD: ${{ secrets.SMOKE_PASSWORD }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Install dependencies
        working-directory: client
        run: npm ci

      - name: Install Playwright browsers
        working-directory: client
        run: npx playwright install --with-deps chromium

      # No service containers, no migrations, no database. The suite is aimed at the
      # deployed origins and refuses to start if they are not the allow-listed ones.
      - name: Run the production smoke suite
        working-directory: client
        run: npm run test:e2e:prod

      # Checks the MCP endpoint with the same smoke account the Playwright suite signs in as,
      # so it needs no secret of its own and no token that has to be renewed. It logs in,
      # mints a short-lived MCP token, runs `initialize` then `tools/list` and a
      # `list_repositories` call that must name SMOKE_REPO_NAME, and revokes the token on any
      # exit. Tokens left behind by a run that died before its revoke are swept first, so
      # they can never fill the account's ten-token allowance.
      #
      # The server is stateless Streamable HTTP and answers each POST as an SSE stream
      # (`text/event-stream`), so the JSON-RPC message is read from the `data:` line. It
      # needs `Accept: application/json, text/event-stream` on every call and, after
      # `initialize`, the negotiated `MCP-Protocol-Version`. There is no session id.
      - name: Check the MCP endpoint
        run: |
          set -euo pipefail
          api="${SMOKE_API_URL%/}"
          tokens="${api}/api/v1/auth/me/mcp-tokens"
          jar="$(mktemp)"
          token_id=""

          revoke() {
            [ -n "$token_id" ] && curl -sS -o /dev/null -b "$jar" -X DELETE "${tokens}/${token_id}" || true
            rm -f "$jar"
          }
          trap revoke EXIT

          curl -sS --fail-with-body --max-time 30 -c "$jar" -H "Content-Type: application/json" \
            -d "$(jq -n --arg e "$SMOKE_EMAIL" --arg p "$SMOKE_PASSWORD" '{email: $e, password: $p}')" \
            "${api}/api/v1/auth/login" >/dev/null

          for stale in $(curl -sS --fail-with-body -b "$jar" "$tokens" | jq -r '.[] | select(.name == "prod-smoke") | .id'); do
            curl -sS -o /dev/null -b "$jar" -X DELETE "${tokens}/${stale}"
          done

          created=$(curl -sS --fail-with-body --max-time 30 -b "$jar" -H "Content-Type: application/json" \
            -d '{"name":"prod-smoke","expires_in_days":30}' "$tokens")
          token_id=$(jq -er '.id' <<<"$created")
          mcp_token=$(jq -er '.token' <<<"$created")
          echo "::add-mask::${mcp_token}"

          post() {
            curl -sS --fail-with-body --max-time 30 \
              -H "Authorization: Bearer ${mcp_token}" \
              -H "Content-Type: application/json" \
              -H "Accept: application/json, text/event-stream" \
              "$@" "${api}/mcp" | tr -d '\r' | sed -n 's/^data: *//p' | jq -s '.[0]'
          }

          init=$(post -d '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-11-25","capabilities":{},"clientInfo":{"name":"prod-smoke","version":"0"}}}')
          version=$(jq -er '.result.protocolVersion' <<<"$init")
          jq -e '.result.serverInfo.name == "illume"' <<<"$init" >/dev/null

          listed=$(post -H "MCP-Protocol-Version: ${version}" -d '{"jsonrpc":"2.0","id":2,"method":"tools/list"}')
          count=$(jq -er '.result.tools | length' <<<"$listed")
          echo "tools/list returned ${count} tools"
          test "$count" -gt 0

          repos=$(post -H "MCP-Protocol-Version: ${version}" -d '{"jsonrpc":"2.0","id":3,"method":"tools/call","params":{"name":"list_repositories","arguments":{}}}')
          jq -e '.result.isError != true' <<<"$repos" >/dev/null
          jq -e --arg name "$SMOKE_REPO_NAME" '[.result.content[].text] | join("\n") | contains($name)' <<<"$repos" >/dev/null
          echo "list_repositories names ${SMOKE_REPO_NAME}"

      - name: Upload the Playwright report
        # On failure only: a green run's report is a large artifact nobody opens.
        #
        # The report folder is named explicitly in the config, because the HTML reporter
        # resolves it against the shell's working directory (`client/`) while `outputDir`
        # resolves against the config file (`e2e-prod/`). That also keeps it clear of the
        # local suite's `client/playwright-report`.
        #
        # `test-results/` is deliberately not uploaded: traces and video are off in this
        # config, because a trace records the values typed into fields and these artifacts
        # are readable by anyone with repository access.
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: prod-smoke-report
          path: client/e2e-prod/playwright-report
          retention-days: 14
          if-no-files-found: ignore
