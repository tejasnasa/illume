name: CI

on:
  pull_request:
  push:
    branches: [main]
  # Nightly, at 03:17 UTC. An off-hour minute rather than :00 so this does not queue
  # behind every other project's scheduled job.
  schedule:
    - cron: "17 3 * * *"

# A new push to the same ref cancels the previous run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-lint:
    name: Backend lint & types
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: server/uv.lock

      - name: Install dependencies
        run: uv sync --dev

      # The test suite must be clean. Existing application code is not yet, so the
      # checks below are split rather than switched off: new test code cannot add
      # problems, and the pre-existing debt stays visible in the log.
      - name: Ruff (tests, blocking)
        run: uv run ruff check tests/

      - name: Ruff format (tests, blocking)
        run: uv run ruff format --check tests/

      - name: Ruff (app, report only)
        continue-on-error: true
        run: uv run ruff check app/

      # --follow-imports=silent checks the test files but suppresses errors inside the
      # application modules they import, which are reported separately below.
      - name: Mypy (tests, blocking)
        run: uv run mypy tests/ --follow-imports=silent

      - name: Mypy (app, report only)
        continue-on-error: true
        run: uv run mypy app

  frontend-lint:
    name: Frontend lint & types
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: client/package-lock.json

      - run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: ESLint (tests, blocking)
        run: npx eslint tests/ e2e/ vitest.config.ts

      # src/ carries pre-existing react-hooks errors; report them without failing the
      # build, so a regression is visible but not confused with the standing debt.
      - name: ESLint (src, report only)
        continue-on-error: true
        run: npm run lint

  backend-tests:
    name: Backend tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: illume
          POSTGRES_PASSWORD: test
          POSTGRES_DB: illume_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U illume -d illume_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7
        ports:
          - 6380:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: server/uv.lock

      - name: Install dependencies
        run: uv sync --dev

      - name: Apply migrations
        run: uv run alembic upgrade head

      - name: Run tests
        run: uv run pytest --cov=app --cov-report=json:coverage.json -n auto

      # The floor file is committed once the suite is mature enough to defend a number.
      # Until then this step is a no-op rather than a red build.
      - name: Coverage ratchet
        run: |
          if [ ! -f .coverage-floor ]; then
            echo "No .coverage-floor committed yet; skipping ratchet."
            exit 0
          fi
          floor=$(cat .coverage-floor)
          measured=$(python -c "import json;print(round(json.load(open('coverage.json'))['totals']['percent_covered'], 2))")
          echo "measured=$measured floor=$floor"
          python -c "import sys; sys.exit(0 if $measured >= $floor else 1)" \
            || { echo "::error::Coverage dropped to ${measured}%, below the committed floor of ${floor}%"; exit 1; }

      - name: Upload coverage JSON
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: server/coverage.json
          if-no-files-found: ignore

  frontend-tests:
    name: Frontend tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: client/package-lock.json

      - run: npm ci

      - name: Run tests with coverage
        run: npm run test:coverage

      - name: Coverage ratchet
        run: |
          if [ ! -f .coverage-floor ]; then
            echo "No .coverage-floor committed yet; skipping ratchet."
            exit 0
          fi
          floor=$(cat .coverage-floor)
          measured=$(node -e "const s=require('./coverage/coverage-summary.json').total;console.log(s.lines.pct)")
          echo "measured=$measured floor=$floor"
          node -e "process.exit($measured >= $floor ? 0 : 1)" \
            || { echo "::error::Coverage dropped to ${measured}%, below the committed floor of ${floor}%"; exit 1; }

  # The only job that runs a real browser against a real stack. Everything above proves
  # a unit or a route in isolation; this is what catches a broken server component, a
  # route that 404s, a cookie that does not survive a redirect, or WebGL failing to
  # initialise in a container with no GPU.
  #
  # Nightly and on main rather than on every PR: it needs a full Next production build,
  # a migrated database, and a Chromium download, which is minutes of work for a signal
  # that a PR review rarely turns on.
  e2e-nightly:
    name: End-to-end (Playwright)
    # `github.event_name` is checked rather than relying on the schedule alone, because
    # `on: push` fires for every branch and this must stay off the PR path.
    if: github.event_name == 'schedule' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: illume
          POSTGRES_PASSWORD: test
          POSTGRES_DB: illume_test
        ports:
          # Offset from the dev default so the credentials in `e2e/env.ts` line up with
          # the same ports `docker-compose.test.yml` publishes locally.
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U illume -d illume_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7
        ports:
          - 6380:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: server/uv.lock

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: client/package-lock.json

      # The seed script imports `tests.factories`, so the dev group is required, not
      # optional.
      - name: Install backend dependencies
        working-directory: server
        run: uv sync --dev

      - name: Install frontend dependencies
        working-directory: client
        run: npm ci

      - name: Install Playwright browsers
        working-directory: client
        run: npx playwright install --with-deps chromium

      # The config starts the OpenAI stub, the API, and the Next server itself. It also
      # builds the client, because `NEXT_PUBLIC_BACKEND_URL` is inlined at build time.
      - name: Run end-to-end tests
        working-directory: client
        run: npm run test:e2e

      - name: Upload the Playwright report
        # On failure only: a green run's report is a large artifact nobody opens.
        #
        # The two artifact paths below are deliberately different, and neither is a typo.
        # Playwright resolves the HTML report's folder against the *shell's* working
        # directory (`client/`, since npm runs the script there), while `outputDir` in the
        # config resolves against the *config file* (`e2e/`). So the report lands in
        # `client/playwright-report` and the traces in `client/e2e/test-results`.
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: client/playwright-report
          retention-days: 14
          if-no-files-found: ignore

      - name: Upload traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: client/e2e/test-results
          retention-days: 14
          if-no-files-found: ignore
